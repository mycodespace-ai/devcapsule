# The docs route. dorny/paths-filter v3 with predicate-quantifier: every and
# picomatch's dot: true. Every pattern is a negation, so a changed file
# selects the route unless one of its listed non-inputs covers it. A new or
# unclassified path therefore builds the website: nothing escapes that
# verification silently. Under picomatch, `a/**` also matches `a` itself,
# which covers the website gitlink.
#
# The Python route is not here. It is the list of inputs in
# .github/ci-python-inputs.yml, which the unit suite is held to.
docs:
  - '!devcapsule-src/devcapsule/**'
  - '!devcapsule-src/tests/**'
  - '!devcapsule-src/scripts/**'
  - '!devcapsule-src/noxfile.py'
  - '!devcapsule-src/dev-requirements.txt'
  - '!devcapsule-webconsole/**'
  - '!docker4pycharm/**'
  - '!engineering-docs/wip/**'
  - '!engineering-docs/archive/**'
  - '!engineering-docs/work-orders/**'
  - '!engineering-docs/session-records/**'
  - '!engineering-docs/bugs/**'
  - '!CURRENT-STATUS.md'
  - '!index.md'
# README, docs, journal, release notes, engineering design notes, the website
# gitlink, .gitmodules, pyproject version and CI definitions still build docs.
